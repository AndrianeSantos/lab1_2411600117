<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="login-wrapper">
        <div class="card login-card shadow-lg">
            
            <div class="card-header text-white text-center py-4">
                <h2 class="mb-0 fw-bold">Student Portal</h2>
                <p class="mb-0 small opacity-75">Sign in to view your GPA, courses & grades</p>
            </div>

            <div class="card-body p-4 bg-white">
                <div id="loginFeedback"></div>

                <form id="loginForm" onsubmit="return false;">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold small text-dark">Student ID / Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold small text-dark">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                    </div>

                    <button type="button" class="btn btn-primary w-100 fw-bold py-2 mt-2" id="loginBtn">Login</button>
                </form>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
