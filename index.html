<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page d-flex align-items-center justify-content-center min-vh-100">

    <div class="container d-flex justify-content-center align-items-center">
        <div class="card login-card shadow-lg" style="max-width: 400px; width: 100%;">
            <div class="card-header bg-primary text-white text-center py-4">
                <h2 class="mb-0 fw-bold">Student Portal</h2>
                <p class="mb-0 small">Sign in to view your GPA, courses & grades</p>
            </div>
            
            <div class="card-body p-4">
                <div id="loginFeedback"></div>

                <form id="loginForm">

                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Student ID / Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                        </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember Me</label>
                    </div>

                    <button type="button" class="btn btn-primary w-100 fw-bold py-2" id="loginBtn">Login</button>
                </form>

                <div class="text-center mt-3">
                    <small class="text-muted">Demo Credentials: admin / password123</small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
